<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>協勤時段熱點查詢｜鳳凰隊員服務平台</title><link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><link rel="manifest" href="../manifest.json">
<style>
:root{--bg:#f4fbfa;--card:#fff;--line:#d7e7e8;--text:#1c4c59;--muted:#71868c;--accent:#2d8898;--soft:#eef8f8;--warn:#8a641f}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}button,select{font:inherit}.shell{max-width:820px;margin:auto;padding:16px 14px 70px}.top{display:flex;align-items:center;gap:12px}.back{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;color:var(--text)}h1{font-size:22px;margin:24px 0 4px}.sub{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:16px}.toolbar{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);padding:12px;border-radius:15px}.toolbar select{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.toolbar button{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:10px 14px;font-weight:800}.status{font-size:13px;color:var(--muted);margin:12px 2px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}.stat b{font-size:25px;display:block}.stat span{font-size:12px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}.card h2{font-size:17px;margin:0 0 12px}.barrow{display:grid;grid-template-columns:72px 1fr 58px;gap:10px;align-items:center;margin:8px 0;font-size:13px}.bar{height:10px;background:#edf3f3;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:99px}.pct{text-align:right;font-weight:800}.low{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 10px;border-radius:999px;background:#fff7e6;color:#7b5a18;border:1px solid #ecd9a4;font-size:13px;font-weight:750}.daily{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;background:#fff}.day b{display:block;font-size:13px;margin-bottom:2px}.announcement{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:12px;line-height:1.7;font-size:14px}.copy{margin-top:10px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;color:var(--text);font-weight:750}.empty{color:var(--muted);font-size:13px}.foot{font-size:11px;color:#92a4a8;text-align:center;margin-top:20px}@media(max-width:620px){.summary{grid-template-columns:1fr}.daily{grid-template-columns:repeat(5,1fr)}.barrow{grid-template-columns:64px 1fr 52px}}
</style></head><body><main class="shell"><div class="top"><button class="back" onclick="location.href='../'">← 返回主頁</button></div><h1>📊 協勤時段熱點查詢</h1><div class="sub">資料來源：即時戰力紀錄。覆蓋率只計算每日 06:00–24:00；同一時段多人同時協勤只算「有覆蓋」，不會重複灌水。</div><div class="toolbar"><select id="month"></select><button onclick="loadData(true)">查詢</button></div><div id="status" class="status">準備載入…</div><div class="summary"><div class="stat"><b id="coverage">-</b><span>06–24 覆蓋率</span></div><div class="stat"><b id="hours">-</b><span>實際覆蓋時數</span></div><div class="stat"><b id="days">-</b><span>統計天數</span></div></div><section class="card"><h2>各小時覆蓋率</h2><div id="hourly"></div></section><section class="card"><h2>平均較少人協勤的時段</h2><div id="low" class="low"></div></section><section class="card"><h2>每日覆蓋率</h2><div id="daily" class="daily"></div></section><section class="card"><h2>可直接公告的摘要</h2><div id="announcement" class="announcement">資料載入後自動產生。</div><button class="copy" onclick="copyAnnouncement()">複製公告文字</button></section><div class="foot">V22.4.4｜分析為協勤覆蓋率，不代表救護案件需求量</div></main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyHMulQdSyjhavNRezIFoHfKt6NtJf3L4RSZ_fujq_w9YT54LfQo0aaoXByEAqrbGCL/exec';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function initMonths(){const sel=document.getElementById('month'),now=new Date();for(let i=0;i<18;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1),k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,o=document.createElement('option');o.value=k;o.textContent=`${d.getFullYear()} 年 ${d.getMonth()+1} 月`;sel.appendChild(o)}}
async function loadData(){const m=month.value;status.textContent='正在分析即時戰力紀錄…';try{const q=new URLSearchParams({action:'getRealtimeForceHotspotsV2244',month:m,t:String(Date.now())});const c=new AbortController(),timer=setTimeout(()=>c.abort(),25000);const r=await fetch(`${API_URL}?${q}`,{cache:'no-store',signal:c.signal});clearTimeout(timer);const x=await r.json();if(!x.success)throw new Error(x.message||'查詢失敗');render(x.data)}catch(e){status.textContent=e.name==='AbortError'?'分析逾時，請稍後再試。':(e.message||'系統連線異常')}}
function render(d){coverage.textContent=`${Number(d.coveragePct||0).toFixed(1)}%`;hours.textContent=`${Number(d.coveredHours||0).toFixed(1)} 小時`;days.textContent=`${d.daysInScope||0} 天`;status.textContent=`${d.monthLabel}｜共分析 ${d.recordCount||0} 筆即時戰力紀錄`;hourly.innerHTML=(d.hourly||[]).map(x=>`<div class="barrow"><span>${esc(x.label)}</span><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,Number(x.coveragePct||0)))}%"></div></div><span class="pct">${Number(x.coveragePct||0).toFixed(1)}%</span></div>`).join('')||'<div class="empty">目前無資料</div>';low.innerHTML=(d.lowestSlots||[]).map(x=>`<span class="chip">${esc(x.label)}｜${Number(x.coveragePct||0).toFixed(1)}%</span>`).join('')||'<span class="empty">目前無資料</span>';daily.innerHTML=(d.daily||[]).map(x=>`<div class="day"><b>${esc(x.day)}</b>${Number(x.coveragePct||0).toFixed(0)}%</div>`).join('')||'<div class="empty">目前無資料</div>';announcement.textContent=d.announcement||'本月尚無足夠資料。'}
async function copyAnnouncement(){try{await navigator.clipboard.writeText(announcement.textContent||'');const b=document.querySelector('.copy');const old=b.textContent;b.textContent='已複製';setTimeout(()=>b.textContent=old,1200)}catch(e){alert('無法自動複製，請長按文字複製')}}
initMonths();loadData();
</script></body></html>
